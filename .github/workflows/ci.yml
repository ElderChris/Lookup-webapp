# =============================================================================
# CI — Lookup
# =============================================================================
# Esegue lint, controllo del formato e verifica degli schemi condivisi.
# Niente deploy automatico (vincolo self-host: il cliente deploya in autonomia).
#
# Rami:
#   - main    = versione stabile
#   - develop = sviluppo
#
# Triggers:
#   - push su develop e main
#   - pull request verso main
#   - manual dispatch (workflow_dispatch) per re-run on-demand
#
# Job:
#   lint: ESLint + import di @lookup/shared + Prettier check
#
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Schemi condivisi importabili
        run: npm run lint -w packages/shared

      - name: Prettier check
        run: npm run format:check
