# =============================================================================
# docker-compose.yml — Lookup
# =============================================================================
# Fase 1a: web (nginx) + postgres (postgis) + redis attivi.
# Fase 1c+: anche api (Fastify backend) — oggi commentato.
# Fase 3+:  anche mailhog (cattura email transactional) — oggi commentato.
#
# Uso:
#   docker compose up              avvia tutto in foreground
#   docker compose up -d           avvia in background
#   docker compose up -d postgres  avvia solo postgres
#   docker compose down            ferma e rimuove i container
#   docker compose down -v         ferma + rimuove anche i volumi (reset DB)
#   docker compose logs -f web     segue i log di nginx
#
# Vincolo "zero dipendenze cloud": tutti i servizi sono open-source self-hosted.
# Vedi docs/architecture.md §1 e §2.
# =============================================================================

services:

  # ==========================================================================
  # FRONTEND — nginx serve i file statici da apps/web/
  # ==========================================================================
  # I volumi sono montati read-only così le modifiche in apps/web/js/, css/,
  # assets/ o agli HTML sono visibili al refresh (no rebuild richiesto).
  web:
    image: nginx:1.27-alpine
    container_name: lookup-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # nginx config
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # frontend assets — montati read-only per hot-reload
      - ./apps/web/index.html:/usr/share/nginx/html/index.html:ro
      - ./apps/web/explore.html:/usr/share/nginx/html/explore.html:ro
      - ./apps/web/library.html:/usr/share/nginx/html/library.html:ro
      - ./apps/web/book-detail.html:/usr/share/nginx/html/book-detail.html:ro
      - ./apps/web/profile.html:/usr/share/nginx/html/profile.html:ro
      - ./apps/web/profile-setup.html:/usr/share/nginx/html/profile-setup.html:ro
      - ./apps/web/add-book.html:/usr/share/nginx/html/add-book.html:ro
      - ./apps/web/login.html:/usr/share/nginx/html/login.html:ro
      - ./apps/web/register.html:/usr/share/nginx/html/register.html:ro
      - ./apps/web/reset-password.html:/usr/share/nginx/html/reset-password.html:ro
      - ./apps/web/loans.html:/usr/share/nginx/html/loans.html:ro
      - ./apps/web/stats.html:/usr/share/nginx/html/stats.html:ro
      - ./apps/web/admin.html:/usr/share/nginx/html/admin.html:ro
      - ./apps/web/privacy.html:/usr/share/nginx/html/privacy.html:ro
      - ./apps/web/terms.html:/usr/share/nginx/html/terms.html:ro
      - ./apps/web/js:/usr/share/nginx/html/js:ro
      - ./apps/web/css:/usr/share/nginx/html/css:ro
      - ./apps/web/assets:/usr/share/nginx/html/assets:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ==========================================================================
  # DATABASE — PostgreSQL 16 + PostGIS 3.4
  # ==========================================================================
  # Volume nominato persistente (`postgres-data`). Per reset completo del DB:
  #   docker compose down -v
  # L'init script in infra/postgres/init.sql viene eseguito UNA SOLA VOLTA al
  # primo avvio (quando il volume è vuoto). Abilita postgis, pg_trgm, citext.
  # Le tabelle vere arrivano via Prisma migration in Fase 1b.
  postgres:
    image: postgis/postgis:16-3.4
    container_name: lookup-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lookup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lookup_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lookup}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lookup} -d ${POSTGRES_DB:-lookup}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # CACHE / SESSION — Redis 7
  # ==========================================================================
  # Usato in Fase 1c+ per: session store (lucia-auth), rate limiting,
  # future queue (BullMQ). Per ora gira "in attesa", consuma ~10MB RAM.
  redis:
    image: redis:7-alpine
    container_name: lookup-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # TODO(fase3): mailhog — cattura email transactional in dev
  # ==========================================================================
  # mailhog:
  #   image: mailhog/mailhog:latest
  #   container_name: lookup-mailhog
  #   ports:
  #     - "${MAILHOG_SMTP_PORT:-1025}:1025"     # SMTP (il backend invia qui)
  #     - "${MAILHOG_WEB_PORT:-8025}:8025"      # UI web per leggere

  # ==========================================================================
  # TODO(fase1c+1d): backend Fastify
  # ==========================================================================
  # api:
  #   build: ./apps/api
  #   container_name: lookup-api
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis:    { condition: service_healthy }
  #   environment:
  #     DATABASE_URL: postgres://lookup:lookup_dev@postgres:5432/lookup
  #     REDIS_URL: redis://redis:6379
  #     # SMTP_HOST: mailhog
  #     # SMTP_PORT: 1025
  #     SESSION_SECRET: ${SESSION_SECRET}
  #     UPLOAD_DIR: /data/uploads
  #     PORT: 3000
  #   ports:
  #     - "${API_PORT:-3000}:3000"
  #   volumes:
  #     - uploads-data:/data/uploads
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  # ==========================================================================
  # OPZIONALE: pgAdmin per ispezione DB via UI web
  # ==========================================================================
  # Attivabile con: docker compose --profile admin up -d
  # Poi http://localhost:5050 — login admin@localhost / admin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lookup-pgadmin
    profiles: [admin]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localhost}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

# =============================================================================
# Volumi nominati persistenti
# =============================================================================
volumes:
  postgres-data:
    name: lookup-postgres-data
  redis-data:
    name: lookup-redis-data
  pgadmin-data:
    name: lookup-pgadmin-data
  # uploads-data:           # TODO(fase4): per i file caricati (avatar, cover)
  #   name: lookup-uploads
