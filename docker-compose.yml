# =============================================================================
# docker-compose.yml — Lookup
# =============================================================================
# Servizi sempre attivi: web (nginx), postgres (PostGIS), redis, mailpit.
# Profili opzionali: backend (api), monitoring (prometheus, grafana),
# admin (pgadmin).
#
# Uso:
#   docker compose up              avvia tutto in foreground
#   docker compose up -d           avvia in background
#   docker compose up -d postgres  avvia solo postgres
#   docker compose down            ferma e rimuove i container
#   docker compose down -v         ferma + rimuove anche i volumi (reset DB)
#   docker compose logs -f web     segue i log di nginx
#
# Vincolo "zero dipendenze cloud": tutti i servizi sono open-source self-hosted.
# =============================================================================

services:

  # ==========================================================================
  # FRONTEND — nginx serve i file statici da apps/web/
  # ==========================================================================
  # I volumi sono montati read-only così le modifiche in apps/web/js/, css/,
  # assets/ o agli HTML sono visibili al refresh (no rebuild richiesto).
  web:
    image: nginx:1.30-alpine
    container_name: lookup-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # nginx config
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount dell'intera cartella apps/web come read-only.
      # Ogni nuovo file HTML viene automaticamente
      # servito senza dover toccare docker-compose.yml.
      # nginx ignora file non-HTML/CSS/JS (no MIME mapping) — innocuo se
      # ci sono no-cache-server.py o package.json residui.
      - ./apps/web:/usr/share/nginx/html:ro
    healthcheck:
      # nginx:alpine include busybox-wget; --spider a volte ha quirks, quindi
      # usiamo direttamente -O - (scrittura su stdout, scartata).
      # 127.0.0.1 e non localhost: nel container localhost puo' risolvere a ::1,
      # nginx ascolta solo in IPv4 e busybox-wget non ripiega su IPv4.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s  # nginx ci mette ~3s a essere ready: damo margine
    restart: unless-stopped

  # ==========================================================================
  # DATABASE — PostgreSQL 16 + PostGIS 3.7
  # ==========================================================================
  # Volume nominato persistente (`postgres-data`). Per reset completo del DB:
  #   docker compose down -v
  # L'init script in infra/postgres/init.sql viene eseguito UNA SOLA VOLTA al
  # primo avvio (quando il volume è vuoto). Abilita postgis, pg_trgm, citext.
  # Le tabelle arrivano dalle migrazioni Prisma (npm run db:migrate:deploy).
  #
  # Aggiornare l'immagine su un volume esistente NON aggiorna l'estensione
  # PostGIS registrata nel database (serve ALTER EXTENSION postgis UPDATE) e,
  # se cambia la versione di Debian dell'immagine, richiede REINDEX degli
  # indici di testo. Con soli dati di prova: docker compose down -v.
  postgres:
    image: postgis/postgis:16-3.7
    container_name: lookup-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lookup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lookup_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lookup}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lookup} -d ${POSTGRES_DB:-lookup}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # CACHE / SESSION — Redis 8
  # ==========================================================================
  # Usato in Fase 1c+ per: session store (lucia-auth), rate limiting,
  # future queue (BullMQ). Per ora gira "in attesa", consuma ~10MB RAM.
  redis:
    image: redis:8.10-alpine
    container_name: lookup-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Mailpit — cattura le email inviate dall'applicazione (ambiente di prova)
  # ==========================================================================
  # UI: http://localhost:8025 — legge tutte le email inviate dal backend
  # (verifica email, reset password, ecc.). Nessuna email esce dal computer.
  # Sostituisce MailHog (non piu' mantenuto): stesse porte, stesso uso.
  # In produzione: sostituire con Resend/SES/SMTP2GO reali (config via env).
  #
  # Configurato come un provider reale: STARTTLS obbligatorio (certificato
  # autofirmato generato all'avvio) e credenziali SMTP. Cosi' l'API usa in
  # prova lo stesso percorso di invio della produzione; l'unica differenza e'
  # SMTP_TLS_VERIFY=false, che accetta il certificato autofirmato.
  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: lookup-mailpit
    environment:
      MP_SMTP_TLS_CERT: sans:mailpit,localhost
      MP_SMTP_TLS_KEY: sans:mailpit,localhost
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH: ${SMTP_USER:-lookup}:${SMTP_PASS:-lookup-dev}
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"     # SMTP (il backend invia qui)
      - "${MAIL_WEB_PORT:-8025}:8025"      # UI web per leggere
    restart: unless-stopped

  # ==========================================================================
  # BACKEND — Fastify API (Fase 1c+)
  # ==========================================================================
  # Servizio attivo ma sotto profilo "backend" — si avvia solo con:
  #   docker compose --profile backend up -d
  # In sviluppo locale conviene NON usare il container ma `npm run dev` da
  # apps/api/ (hot-reload via node --watch, più rapido). Il container serve
  # per la demo cliente self-contained dove "docker compose up" deve dare
  # l'intero stack funzionante.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: lookup/api:dev
    pull_policy: build
    container_name: lookup-api
    profiles: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lookup}:${POSTGRES_PASSWORD:-lookup_dev}@postgres:5432/${POSTGRES_DB:-lookup}?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER:-lookup}
      SMTP_PASS: ${SMTP_PASS:-lookup-dev}
      SMTP_TLS_VERIFY: "false"   # solo per Mailpit: certificato autofirmato
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080},http://localhost:8765
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ==========================================================================
  # OPZIONALE: pgAdmin per ispezione DB via UI web
  # ==========================================================================
  # Attivabile con: docker compose --profile admin up -d
  # Poi http://localhost:5050 — login admin@localhost / admin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lookup-pgadmin
    profiles: [admin]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localhost}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  # ==========================================================================
  # PROMETHEUS — Beta 10: scraping metriche time-series
  # ==========================================================================
  # Scrapa GET /metrics dal backend api ogni 15s. Conserva 30 giorni di
  # storia. UI accessibile su http://localhost:9090 (Explorer PromQL).
  # Profile: monitoring (attiva con: docker compose --profile monitoring up -d)
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: lookup-prometheus
    profiles: [monitoring]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # ==========================================================================
  # GRAFANA — Beta 10: dashboard visualizzazione metriche
  # ==========================================================================
  # UI accessibile su http://localhost:3001 (login admin/admin di default).
  # Datasource Prometheus e dashboard sono provisioned automaticamente dai
  # file in docker/monitoring/grafana/.
  grafana:
    image: grafana/grafana:13.3.1
    container_name: lookup-grafana
    profiles: [monitoring]
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

# =============================================================================
# Volumi nominati persistenti
# =============================================================================
volumes:
  postgres-data:
    name: lookup-postgres-data
  redis-data:
    name: lookup-redis-data
  pgadmin-data:
    name: lookup-pgadmin-data
  # Beta 10: monitoring
  prometheus-data:
    name: lookup-prometheus-data
  grafana-data:
    name: lookup-grafana-data
  # uploads-data:           # TODO(fase4): per i file caricati (avatar, cover)
  #   name: lookup-uploads
