# =============================================================================
# docker-compose.yml — Libreria Diffusa
# =============================================================================
# Fase 0d: solo frontend statico via nginx.
# Fase 1+: aggiunti postgres, redis, mailhog, api (vedi commenti TODO sotto).
#
# Uso:
#   docker compose up              # avvia in foreground
#   docker compose up -d           # avvia in background
#   docker compose down            # ferma e rimuove i container
#   docker compose logs -f web     # segui i log di nginx
#
# Vincolo "zero dipendenze cloud": tutti i servizi sono container open-source.
# Vedi docs/architecture.md §1 e §2.
# =============================================================================

services:

  # ==========================================================================
  # FRONTEND — nginx serve i file statici
  # ==========================================================================
  # In dev i volumi sono montati read-only così le modifiche in `./js`, `./css`,
  # `./assets` o agli HTML sono visibili al refresh (no rebuild richiesto).
  web:
    image: nginx:1.27-alpine
    container_name: libreria-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # nginx config
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # frontend assets — montati read-only per hot-reload
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./explore.html:/usr/share/nginx/html/explore.html:ro
      - ./library.html:/usr/share/nginx/html/library.html:ro
      - ./book-detail.html:/usr/share/nginx/html/book-detail.html:ro
      - ./profile.html:/usr/share/nginx/html/profile.html:ro
      - ./profile-setup.html:/usr/share/nginx/html/profile-setup.html:ro
      - ./add-book.html:/usr/share/nginx/html/add-book.html:ro
      - ./login.html:/usr/share/nginx/html/login.html:ro
      - ./register.html:/usr/share/nginx/html/register.html:ro
      - ./reset-password.html:/usr/share/nginx/html/reset-password.html:ro
      - ./loans.html:/usr/share/nginx/html/loans.html:ro
      - ./stats.html:/usr/share/nginx/html/stats.html:ro
      - ./admin.html:/usr/share/nginx/html/admin.html:ro
      - ./privacy.html:/usr/share/nginx/html/privacy.html:ro
      - ./terms.html:/usr/share/nginx/html/terms.html:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./assets:/usr/share/nginx/html/assets:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

