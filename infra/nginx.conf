# =============================================================================
# nginx config — Lookup
# =============================================================================
# Serve il frontend statico dal volume Docker e inoltra /api/* al backend
# Fastify (container `api`). Login, sessione e notifiche in tempo reale del
# frontend usano percorsi relativi (/api/auth/*, /api/me/events) e passano da
# qui.
#
# Cache-Control: coerente con `no-cache-server.py` (no-store), così le
# modifiche in dev sono visibili al refresh senza force-reload.
# In Fase 5 (privacy hardening) configureremo cache headers production-ready.
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Charset esplicito (i file italiani hanno caratteri accentati)
    charset utf-8;

    # DNS interno di Docker, risolto a ogni richiesta: nginx si avvia anche
    # quando il container `api` non e' in esecuzione (in quel caso /api/*
    # risponde 502 invece di impedire l'avvio del frontend).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # =========================================================================
    # Frontend statico
    # =========================================================================
    location / {
        # Headers di sicurezza base (saranno raffinati in Fase 5).
        # Definiti qui e non a livello server: le risposte dell'API hanno gia'
        # i propri (helmet) e non devono essere duplicate.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # No-cache durante lo sviluppo: ogni refresh ricarica da disco.
        # In produzione (Fase 5+) sostituire con caching aggressivo su asset
        # versionati e Cache-Control: no-store solo sui file HTML.
        add_header Cache-Control "no-store, must-revalidate" always;

        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # Backend: /api/* inoltrato al container api
    # =========================================================================
    location /api/ {
        # Variabile = risoluzione a runtime (vedi resolver sopra). Senza URI
        # dopo l'host, nginx inoltra il percorso originale invariato.
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-Sent Events (/api/me/events): niente buffering e connessioni
        # lunghe. Il backend manda un heartbeat ogni 25 s.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        # Backend non avviato o non raggiungibile: risposta JSON invece della
        # pagina index.html prevista da error_page a livello server.
        error_page 502 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"code":"API_UNAVAILABLE","message":"Server non raggiungibile. Riprova tra poco."}';
    }

    # MIME types: nginx default copre HTML/CSS/JS/JSON.
    # Forziamo il MIME corretto per i moduli ES (alcuni client vecchi)
    location ~ \.js$ {
        add_header Content-Type "text/javascript; charset=utf-8";
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # =========================================================================
    # Healthcheck per Docker
    # =========================================================================
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # location /uploads/ {
    #     # In Fase 4: serve i file statici caricati (avatar, cover libri)
    #     # dal volume condiviso con il backend
    #     alias /data/uploads/;
    #     add_header Cache-Control "public, max-age=2592000" always;  # 30gg
    # }

    # =========================================================================
    # Error pages
    # =========================================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
