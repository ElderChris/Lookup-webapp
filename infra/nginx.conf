# =============================================================================
# nginx config — Lookup (Fase 0d, dev/demo)
# =============================================================================
# Serve il frontend statico dal volume Docker. In Fase 1 verrà aggiunto
# il blocco `location /api/ { proxy_pass ... }` per inoltrare le richieste
# al backend Fastify. Per ora c'è solo il frontend.
#
# Cache-Control: coerente con `no-cache-server.py` (no-store), così le
# modifiche in dev sono visibili al refresh senza force-reload.
# In Fase 5 (privacy hardening) configureremo cache headers production-ready.
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Charset esplicito (i file italiani hanno caratteri accentati)
    charset utf-8;

    # Headers di sicurezza base (saranno raffinati in Fase 5)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No-cache durante lo sviluppo: ogni refresh ricarica da disco.
    # In produzione (Fase 5+) sostituire con caching aggressivo su asset
    # versionati e Cache-Control: no-store solo sui file HTML.
    add_header Cache-Control "no-store, must-revalidate" always;

    # =========================================================================
    # Frontend statico
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # MIME types: nginx default copre HTML/CSS/JS/JSON.
    # Forziamo il MIME corretto per i moduli ES (alcuni client vecchi)
    location ~ \.js$ {
        add_header Content-Type "text/javascript; charset=utf-8";
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # =========================================================================
    # Healthcheck per Docker
    # =========================================================================
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # TODO(fase1): proxy /api/* al backend Fastify
    # =========================================================================
    # location /api/ {
    #     proxy_pass http://api:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    #
    # location /uploads/ {
    #     # In Fase 4: serve i file statici caricati (avatar, cover libri)
    #     # dal volume condiviso con il backend
    #     alias /data/uploads/;
    #     add_header Cache-Control "public, max-age=2592000" always;  # 30gg
    # }

    # =========================================================================
    # Error pages
    # =========================================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
